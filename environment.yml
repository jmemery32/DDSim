name: ddsim
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - netcdf4   # Exodus II (NetCDF) reader
  - numba     # tight-loop acceleration
  - pytest
  - matplotlib
  - pip
  - pip:
      - -e .[docs]  # editable install of ddsim + Sphinx/furo for `make docs` (see pyproject.toml)
