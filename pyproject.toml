[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddsim"
version = "1.5.0"
description = "DDSim Level I: hierarchical, probabilistic fatigue life prediction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "John Emery" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    # numba>=0.63 dropped prebuilt wheels for Intel macOS (source-only,
    # needing a local LLVM/cmake toolchain) -- 0.62.1 is the newest release
    # that still ships one. Pinned so `pip install` alone (no conda) works
    # on Intel Mac without a compiler; revisit if that platform's wheels
    # come back, or relax further once Intel Mac support no longer matters.
    "numba>=0.58,<0.63",
]

[project.optional-dependencies]
exodus = ["netCDF4"]
plotting = ["matplotlib"]
dev = ["pytest"]
docs = ["sphinx", "furo"]

[project.scripts]
ddsim = "ddsim.DDSim:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
